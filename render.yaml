services:
  - type: web
    name: recruiterpulse
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: recruiterpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_USERS_JSON
        sync: false
      - key: GOOGLE_SHEETS_SYNC_INTERVAL_MINUTES
        value: "15"

databases:
  - name: recruiterpulse-db
    databaseName: recruiterpulse
    user: recruiterpulse
    plan: 0.1c-256mb
    region: singapore
